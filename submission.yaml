submission:
  title: "MissionReady Copilot"

  problem_statement: >
    Military organisations struggle to determine the real-time mission readiness
    of aircraft, vehicles, and equipment because maintenance is often based on
    fixed schedules rather than actual component condition. HUMS sensor data and
    service records that could reveal early signs of failure often remain
    underanalysed, leading to unexpected breakdowns, reduced operational
    readiness, and inefficient maintenance planning.

  solution_summary: >
    We built an AI-powered Mission Readiness and Predictive Maintenance Copilot
    that analyses sensor data and historical service records to identify
    non-ready assets, explain the reasons behind readiness issues, predict
    potential component failures, and generate a prioritised maintenance plan
    for upcoming mission windows.

  key_features:
    - "Mission-readiness assessment for individual assets using sensor and service data"
    - "Explainable identification of readiness issues and abnormal component behaviour"
    - "Predictive failure-risk analysis for components before the next mission window"
    - "Prioritised maintenance recommendations based on risk, urgency, and mission impact"
    - "AI copilot interface for querying asset health and maintenance insights"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]
    databases: ["PostgreSQL"]
    other: ["Pandas", "Scikit-learn", "REST APIs", "Git", "Docker"]

  what_we_are_most_proud_of: >
    Our strongest feature is connecting predictive analytics with explainable
    mission-readiness decisions. Instead of only predicting that a component
    may fail, the copilot connects sensor trends and service history to explain
    why an asset is at risk and translates those findings into an actionable,
    prioritised maintenance plan.

  known_limitations: >
    The prototype uses simulated or historical datasets rather than live
    military HUMS feeds. Predictive accuracy is therefore dependent on the
    quality and coverage of the available training data, and the prototype is
    intended as a decision-support system rather than an autonomous maintenance
    or operational control system.



# docker-compose.prod.yml — pull pre-built images from Docker Hub
#
# Usage (no local build required):
#   DOCKERHUB_USERNAME=yourhandle docker compose -f docker-compose.prod.yml up -d
#
# Or export it once in your shell:
#   export DOCKERHUB_USERNAME=yourhandle
#   docker compose -f docker-compose.prod.yml up -d
#
# Set IMAGE_TAG to pin a specific release (default: latest):
#   IMAGE_TAG=v1.2.3 docker compose -f docker-compose.prod.yml up -d

services:
  # ─── PostgreSQL database ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: missionready
      POSTGRES_PASSWORD: missionready_dev_password
      POSTGRES_DB: missionready
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missionready -d missionready"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Alembic migrations (one-shot) ────────────────────────────────────────
  migrate:
    image: ${DOCKERHUB_USERNAME}/missionready-backend:${IMAGE_TAG:-latest}
    command: alembic upgrade head
    env_file:
      - ./src/.env
    environment:
      DATABASE_URL: postgresql+psycopg://missionready:missionready_dev_password@db:5432/missionready
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ─── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USERNAME}/missionready-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./src/.env
    environment:
      DATABASE_URL: postgresql+psycopg://missionready:missionready_dev_password@db:5432/missionready
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Next.js frontend ─────────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME}/missionready-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
